env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://81.69.15.136:3306/yzl_prd?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai"
    username = "root"
    password = "${source_password}"
    query = "SELECT id, order_id, amount, create_time, update_time FROM yzl_order"
  }
}

sink {
  StarRocks {
    # Use the cloud-mapped BE HTTP endpoint. The FE endpoint redirects Stream
    # Load requests to a Docker-private address that is not reachable here.
    nodeUrls = ["81.69.15.136:8040"]
    base-url = "jdbc:mysql://81.69.15.136:9030/"
    username = "dev_0904"
    password = "${target_password}"
    database = "ods"
    table = "yzl_order"
    batch_max_rows = 1000
    max_retries = 2
    enable_upsert_delete = true
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}
