ng:8px 10px 8px 38px;color:#8e9aaa;font-size:10px}.empty{padding:34px 18px;text-align:center;color:#95a1b0;font-size:12px;line-height:1.7}.empty i{display:block;font-size:28px;color:#c3ccd7;margin-bottom:8px}
.detail{min-width:0}.detail-head{min-height:76px;flex:0 0 76px;border-bottom:1px solid #edf1f5;display:flex;align-items:center;padding:0 18px;gap:12px}.detail-symbol{width:40px;height:40px;border-radius:10px;background:#eaf2ff;color:#2c72dd;display:grid;place-items:center;font-size:20px}.detail-title{font-size:17px;font-weight:700;color:#253b57}.detail-path{margin-top:5px;font-size:11px;color:#8996a7}.detail-tags{margin-left:auto;display:flex;gap:7px}.tag{height:23px;padding:0 8px;border-radius:6px;background:#f1f4f8;color:#718095;font-size:10px;display:inline-flex;align-items:center}.tabs{height:44px;flex:0 0 44px;border-bottom:1px solid #edf1f5;display:flex;align-items:flex-end;padding-left:18px;gap:24px}.tabs.hidden{display:none}.tab{height:44px;border:0;background:none;color:#68788f;padding:0 2px;position:relative;cursor:pointer}.tab.on{color:#286ed7;font-weight:650}.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#3478f6}.detail-body{flex:1;min-height:0;overflow:auto}.tab-pane{display:none;min-height:100%}.tab-pane.on{display:block}.overview{padding:16px 18px 22px}.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fact{min-height:70px;border:1px solid #e8edf3;border-radius:8px;background:#fbfcfe;padding:11px 12px}.fact label{display:block;color:#8995a5;font-size:10px;margin-bottom:7px}.fact strong{display:block;color:#304863;font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.section{margin-top:15px;border:1px solid #e8edf3;border-radius:8px;overflow:hidden}.section-title{height:38px;background:#fafbfd;border-bottom:1px solid #edf1f5;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:650;color:#3e5571}.section-body{padding:12px;color:#65758b;font-size:12px;line-height:1.7;min-height:48px}.source-grid{display:grid;grid-template-columns:120px 1fr 120px 1fr;gap:0}.source-grid span,.source-grid b{padding:10px 12px;border-bottom:1px solid #edf1f5;font-size:11px}.source-grid span{color:#8995a5;background:#fbfcfe}.source-grid b{font-weight:550;color:#405772;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-grid>*:nth-last-child(-n+4){border-bottom:0}
.db-browser{padding:16px 18px 22px}.db-browser-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.db-browser-head .search{width:280px;margin-left:auto}.data-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}.data-table th{height:38px;background:#f7f9fb;color:#65758b;text-align:left;padding:0 12px;font-weight:600;position:sticky;top:0;z-index:1}.data-table td{height:40px;border-bottom:1px solid #edf1f5;padding:0 12px;color:#3d536f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.data-table tr:hover td{background:#fbfdff}.click-row{cursor:pointer}.field-name{font-family:Consolas,Monaco,monospace;color:#2168c9}.nullable{font-size:9px;border-radius:5px;padding:2px 6px;background:#edf7f2;color:#16845f}.nullable.no{background:#fff1e9;color:#bf6a16}.lineage-wrap{padding:16px 18px}.lineage-tip{margin-bottom:12px;padding:9px 11px;border:1px solid #dce8f8;border-radius:7px;background:#f6f9fe;color:#617994;font-size:11px}.direction{font-size:10px;border-radius:5px;padding:2px 6px;background:#edf3fc;color:#4071b6}.loading{opacity:.55;pointer-events:none}.toast{position:fixed;right:24px;top:88px;z-index:1000;min-width:220px;max-width:420px;padding:11px 14px;border:1px solid #dfe6ef;border-radius:8px;background:#fff;color:#405772;font-size:12px;box-shadow:0 12px 28px rgba(30,47,75,.13);opacity:0;transform:translateY(-8px);transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:none}.toast.error{border-color:#f0c9c6;color:#bd4b47}.skeleton{padding:20px;color:#8f9baa;font-size:12px}
@media(max-width:1360px){.metadata-page{padding-left:16px;padding-right:16px}.metadata-shell{grid-template-columns:270px minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 24px}.brand{min-width:205px}.global-search{display:none}}
.fact-value{display:flex;align-items:center;gap:7px;min-width:0}.fact-value strong{min-width:0;flex:1}.fact-action{width:24px;height:24px;flex:0 0 24px;border:0;border-radius:6px;background:#edf3ff;color:#3478f6;display:grid;place-items:center;cursor:pointer}.fact-action:hover{background:#dfeaff}.table-profile-facts .fact strong{font-size:15px;color:#263f5d}.owner-fact .fact-value strong{font-size:15px;color:#263f5d}

<body>
<header class="topbar"><div class="brand"><div class="logo"></div><div><div class="brand-name">Data Platform</div><div class="brand-sub">让数据创造更大价值</div></div></div><nav class="nav"><button data-page="workbench">工作台</button><button data-page="source" class="on">元数据</button><button data-page="integration">数据集成</button><button data-page="development">数据开发</button><button data-page="workflow">工作流</button><button data-page="operations">调度运维</button><button data-page="assets">数据资产</button><button data-page="settings" style="display:none">系统设置</button></nav><div class="top-actions"><div class="global-search"><i class="ri-search-line"></i><span>搜索表、字段、任务…</span></div><button class="icon-btn"><i class="ri-question-line"></i></button><div class="profile"><div class="avatar">U</div><div><div class="pname">用户</div><div class="prole">数据平台</div></div></div></div></header>
<main class="metadata-page">
  <div class="page-head"><div class="breadcrumb">元数据 / <b id="crumbSource">数据源</b> / <span id="crumbObject">浏览</span></div><div class="head-spacer"></div><span class="source-state" id="sourceState"><i class="ri-checkbox-blank-circle-fill"></i><span>未检测</span></span><select class="source-select" id="metadataSourceSelect"><option value="">加载数据源…</option></select><button class="btn" id="testConnection"><i class="ri-pulse-line"></i>检测连接</button><button class="btn primary" id="metadataRefresh"><i class="ri-refresh-line"></i>刷新元数据</button></div>
  <section class="metadata-shell">
    <aside class="pane"><div class="pane-head"><strong>元数据目录</strong><span class="count" id="databaseCount">0 个数据库</span></div><div class="pane-search"><input class="search" id="catalogSearch" placeholder="搜索数据库或数据表"></div><div class="tree" id="catalogTree"><div class="skeleton">正在加载数据库…</div></div></aside>
    <section class="pane detail">
      <div class="detail-head"><div class="detail-symbol" id="detailSymbol"><i class="ri-database-2-line"></i></div><div><div class="detail-title" id="detailTitle">请选择数据库</div><div class="detail-path" id="detailPath">从左侧元数据目录选择数据库或数据表</div></div><div class="detail-tags"><span class="tag" id="detailType">—</span><span class="tag" id="detailFieldCount">—</span></div></div>
      <div class="tabs hidden" id="detailTabs"><button class="tab on" data-tab="overview">概览</button><button class="tab" data-tab="fields">字段</button><button class="tab" data-tab="lineage">血缘</button></div>
      <div class="detail-body"><div class="tab-pane on" id="pane-overview"><div class="empty"><i class="ri-database-2-line"></i>请选择数据库</div></div><div class="tab-pane" id="pane-fields"><div class="empty">请选择数据表</div></div><div class="tab-pane" id="pane-lineage"><div class="empty">请选择数据表</div></div></div>
    </section>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="/metadata-live.js?v=20260912-03"></script>
</body>
