name: build-and-test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run backend tests
        run: mvn -B clean test
      - name: Build deployable package
        run: mvn -B package -DskipTests
      - name: Verify frontend is packaged into jar
        run: jar tf target/bigdata-platform-0.1.0-SNAPSHOT.jar | grep -q 'BOOT-INF/classes/static/index.html'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
