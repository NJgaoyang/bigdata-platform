server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://81.69.15.136:3306/bigdata_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${PLATFORM_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration

platform:
  features:
    realtime-sync: false

  security:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
    admin-username: ${PLATFORM_ADMIN_USERNAME:admin}
    admin-password-hash: ${PLATFORM_ADMIN_PASSWORD_SHA256:}
    session-ttl-minutes: ${PLATFORM_SESSION_TTL_MINUTES:480}

  query:
    default-max-rows: 1000
    timeout-seconds: 300

  starrocks:
    version: "3.3.22"

  seatunnel:
    version: "2.3.12"
    home: /data/software/seatunnel
    real-enabled: false

  scheduler:
    type: dolphinscheduler
    dolphinscheduler:
      base-url: http://81.69.15.136:12345
      version: "3.1.9"
      install-dir: /data/software/dolphinscheduler
      username: admin
      project-code: ${DOLPHINSCHEDULER_PROJECT_CODE:22919517565792}
      tenant-code: ${DOLPHINSCHEDULER_TENANT_CODE:bigdata}
      password: ${DOLPHINSCHEDULER_PASSWORD:}
      token: ${DOLPHINSCHEDULER_TOKEN:}
      real-enabled: false
