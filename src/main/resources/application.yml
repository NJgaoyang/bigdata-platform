server:
  port: 8080

spring:
  application:
    name: bigdata-platform
  datasource:
    url: jdbc:h2:mem:bigdata_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

platform:
  features:
    realtime-sync: false
  security:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
    admin-username: ${PLATFORM_ADMIN_USERNAME:admin}
    admin-password-hash: ${PLATFORM_ADMIN_PASSWORD_SHA256:}
    session-ttl-minutes: ${PLATFORM_SESSION_TTL_MINUTES:480}
  query:
    default-max-rows: 1000
    timeout-seconds: 300
  starrocks:
    version: "3.3.22"
  seatunnel:
    version: "2.3.12"
    home: /data/software/seatunnel
    real-enabled: false
  scheduler:
    type: dolphinscheduler
    dolphinscheduler:
      base-url: ${DOLPHINSCHEDULER_BASE_URL:http://192.168.113.135:12345}
      version: "3.1.9"
      install-dir: /data/software/dolphinscheduler
      username: admin
      project-code: ${DOLPHINSCHEDULER_PROJECT_CODE:bigdata-platform}
      tenant-code: ${DOLPHINSCHEDULER_TENANT_CODE:bigdata}
      password: ${DOLPHINSCHEDULER_PASSWORD:}
      token:
      real-enabled: ${DOLPHINSCHEDULER_REAL_ENABLED:false}
