server:
  port: ${DATASPHERE_PORT:8080}

spring:
  application:
    name: DataSphere
  datasource:
    url: ${DATASPHERE_DB_URL:jdbc:mysql://127.0.0.1:3306/datasphere?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATASPHERE_DB_USERNAME:root}
    password: ${DATASPHERE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: DataSphereScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.useProperties: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

datasphere:
  features:
    realtime-sync: true
  security:
    enabled: ${DATASPHERE_AUTH_ENABLED:false}
    admin-username: ${DATASPHERE_ADMIN_USERNAME:admin}
    admin-initial-password: ${DATASPHERE_ADMIN_INITIAL_PASSWORD:}
    session-ttl-minutes: ${DATASPHERE_SESSION_TTL_MINUTES:480}
  query:
    default-max-rows: ${DATASPHERE_QUERY_MAX_ROWS:1000}
    timeout-seconds: ${DATASPHERE_QUERY_TIMEOUT_SECONDS:300}
    max-concurrent-queries: ${DATASPHERE_QUERY_MAX_CONCURRENT:8}
  starrocks:
    version: "3.3.22"
  seatunnel:
    version: "2.3.12"
    home: ${SEATUNNEL_HOME:/data/software/seatunnel}
    real-enabled: ${SEATUNNEL_REAL_ENABLED:false}
  scheduler:
    type: ${DATASPHERE_SCHEDULER_TYPE:local}
    dolphinscheduler:
      base-url: ${DOLPHINSCHEDULER_BASE_URL:http://127.0.0.1:12345}
      version: "3.1.9"
      install-dir: /data/software/dolphinscheduler
      username: ${DOLPHINSCHEDULER_USERNAME:admin}
      project-code: ${DOLPHINSCHEDULER_PROJECT_CODE:datasphere}
      tenant-code: ${DOLPHINSCHEDULER_TENANT_CODE:datasphere}
      password: ${DOLPHINSCHEDULER_PASSWORD:}
      token: ${DOLPHINSCHEDULER_TOKEN:}
      real-enabled: ${DOLPHINSCHEDULER_REAL_ENABLED:false}
      fail-retry-times: ${DOLPHINSCHEDULER_FAIL_RETRY_TIMES:3}
      fail-retry-interval: ${DOLPHINSCHEDULER_FAIL_RETRY_INTERVAL:1}
      worker-group: ${DOLPHINSCHEDULER_WORKER_GROUP:default}
