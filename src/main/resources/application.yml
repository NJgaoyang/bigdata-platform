server:
  port: 8080

spring:
  application:
    name: bigdata-platform
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:mysql://81.69.15.136:3306/bigdata_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PLATFORM_DB_USERNAME:root}
    password: ${PLATFORM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

platform:
  features:
    realtime-sync: false
  security:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
    admin-username: ${PLATFORM_ADMIN_USERNAME:admin}
    admin-password-hash: ${PLATFORM_ADMIN_PASSWORD_SHA256:}
    session-ttl-minutes: ${PLATFORM_SESSION_TTL_MINUTES:480}
  query:
    default-max-rows: 1000
    timeout-seconds: 300
  starrocks:
    version: "3.3.22"
  seatunnel:
    version: "2.3.12"
    home: /data/software/seatunnel
    real-enabled: ${SEATUNNEL_REAL_ENABLED:true}
  scheduler:
    type: dolphinscheduler
    dolphinscheduler:
      base-url: ${DOLPHINSCHEDULER_BASE_URL:http://81.69.15.136:12345}
      version: "3.1.9"
      install-dir: /data/software/dolphinscheduler
      username: admin
      project-code: ${DOLPHINSCHEDULER_PROJECT_CODE:22919517565792}
      tenant-code: ${DOLPHINSCHEDULER_TENANT_CODE:bigdata}
      password: ${DOLPHINSCHEDULER_PASSWORD}
      token:
      real-enabled: ${DOLPHINSCHEDULER_REAL_ENABLED:true}
